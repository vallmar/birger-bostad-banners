<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner 250x600 Banner2 </title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Adform DHTML Library - Required for Adform compliance -->
    <script>
        document.write('<script src="' + (window.API_URL || 'https://s1.adform.net/banners/scripts/rmb/Adform.DHTML.js?bv=' + Math.random()) + '"><\/script>');
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Sora', sans-serif;
        }
        
        .banner {
            width: 250px;
            height: 600px;
            position: relative;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
        }
        
        .background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
           
        .jpg-overlay {
            position: absolute;
            z-index: 1;
            top: 55px;
            left: 22px;
        }
        
        /* SPLASH POSITION LOCKED: do not change top/left */
        .splash {
            position: absolute;
            top: 55px;   /* locked */
            left: 39px;   /* locked */
            width: 168px;
            z-index: 2;
            opacity: 1;
            
            transform: scale(0);
            transform-origin: top center;
            animation: splashHalfCircle 1.2s ease-out 0.5s forwards;
            will-change: transform, opacity;
            --splash-overlay: #27221f;
        }

        @keyframes splashHalfCircle {
            0% {
                transform: scale(0);
                filter: blur(6px);
            }
            100% {
                transform: scale(1);
                filter: blur(0);
            }
        }

        .splash::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: var(--splash-overlay);
            clip-path: ellipse(50% 100% at 50% 0%);
            opacity: 1;
            transform: scale(0);
            transform-origin: top center;
            animation: splashHalfCircle 1s ease-out 0s forwards, overlayFade 0.45s ease-in 1.9s forwards;
            will-change: transform, opacity;
        }

        @keyframes overlayFade { to { opacity: 0; } }

        .cta {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease;
            width: 203px;
            top: 471px;
            left: 23px;
            overflow: hidden;
            z-index: 2;
        }

        .cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: lightSweep 1.5s ease-out 3s forwards;
        }
        
        .cta:hover {
            transform: scale(1.05);
        }
        
        .cta svg {
            width: auto;
            height: auto;
        }
        
        @keyframes lightSweep {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="banner">
        <div class="background">
            <img src="Banner-250x600-2.svg" alt="Banner Background" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div class="jpg-overlay">
            <img src="Banner-250x360-2.jpg" alt="Banner Overlay" style="width: 200px; height: auto;">
        </div>
        <div class="cta">
            <img src="CTA-Banner-250X360.svg" alt="Call to Action">
        </div>
        <div class="splash">
            <img src="Splash-Banner2.svg" alt="Exclusive Preview" style="display:block; width:100%; height:auto;">
        </div>
    </div>

    <script>
        // Adform compliance script with proper clickTAG implementation
        (function() {
            'use strict';
            
            var banner = document.getElementById('banner');
            var clickTracked = false;
            
            // Get clickTAG value using Adform DHTML library
            var clickTAGvalue = dhtml.getVar('clickTAG', 'https://www.birgerbostad.se');
             
            
            // Click tracking function
            function trackClick() {
                if (clickTracked) return;
                clickTracked = true;
                
                try {
                    // Adform click tracking
                    if (typeof window.adform !== 'undefined' && window.adform.track) {
                        window.adform.track();
                    }
                    
                    // Use clickTAG value for landing page
                    window.open(clickTAGvalue, '_blank');
                } catch (e) {
 
                    // Fallback to clickTAG value
                    window.open(clickTAGvalue, '_blank');
                }
            }
            
            // Exit tracking function
            function trackExit() {
                try {
                    if (typeof window.adform !== 'undefined' && window.adform.trackExit) {
                        window.adform.trackExit();
                    }
                } catch (e) {
                     
                }
            }
            
            // Event listeners
            banner.addEventListener('click', trackClick);
            
            
            // Fallback for non-JavaScript environments
            banner.style.cursor = 'pointer';
            
            // Animation completion tracking
            setTimeout(function() {
                try {
                    if (typeof window.adform !== 'undefined' && window.adform.trackImpression) {
                        window.adform.trackImpression();
                    }
                } catch (e) {
                      
                }
            }, 3500); // After all animations complete (0.5s + 1.2s + 2s + buffer)
            
        })();
    </script>
</body>
</html>
