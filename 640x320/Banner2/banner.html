<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner 640x320 Banner2 </title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    
    <!-- Adform DHTML Library - Required for Adform compliance -->
    <script>
        document.write('<script src="' + (window.API_URL || 'https://s1.adform.net/banners/scripts/rmb/Adform.DHTML.js?bv=' + Math.random()) + '"><\/script>');
    </script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Sora', sans-serif;
        }
        
        .banner {
            width: 640px;
            height: 320px;
            position: relative;
            overflow: hidden;
            background: #fff;
            cursor: pointer;
        }
        
        .background {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .jpg-overlay {
            position: absolute;
            z-index: 1;
            left: 20px;
            top: 44px;
        }
        
        .splash {
            position: absolute;
            top: 44px;
            left: 100px;
            width: 190px;
            height: 95px;
            z-index: 2;
            opacity: 1;
            transform: scale(0);
            transform-origin: top center;
            animation: splashHalfCircle 1.2s ease-out 0.5s forwards;
            --splash-overlay: #27221f;
            will-change: transform, opacity;
            background-color: #27221f;
            clip-path: ellipse(50% 100% at 50% 0%);
            color: white;
            text-align: center;
            font-weight: 100;
            font-variant: normal;
        }

        .splash::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: var(--splash-overlay);
            clip-path: ellipse(50% 100% at 50% 0%);
            opacity: 1;
            transform: scale(0);
            transform-origin: top center;
            animation: splashHalfCircle 1.2s ease-out -0.5s forwards, overlayFade 0.45s ease-in 1.9s forwards;
            will-change: transform, opacity;
        }

        @keyframes splashHalfCircle {
            0% {
                transform: scale(0);
                filter: blur(0px);
            }
            100% {
                transform: scale(1);
                filter: blur(0);
            }
        }

        @keyframes overlayFade {
            to { opacity: 0; }
        }
        
        .cta {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease;
            width: 205px;
            top: 200px;
            left: 400px;
            overflow: hidden;
            z-index: 2;
        }
        
        .cta::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: lightSweep 1.5s ease-out 3s forwards;
        }
        
        .cta:hover {
            transform: scale(1.05);
        }
        
        .cta svg {
            width: auto;
            height: auto;
        }
        
        @keyframes ctaLightSweep {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        @keyframes lightSweep {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="banner" id="banner">
        <div class="background">
            <img src="Banner-640x320-2.svg" alt="Banner Background" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
        <div class="jpg-overlay">
            <img src="Banner-640x320-2.jpg" alt="Banner Overlay" style="width: 350px; height: auto;">
        </div>
        <div class="cta">
            <img src="CTA-BANNER-640x320-2.svg" alt="Call to Action">
        </div>
        <div class="splash">
            <div style="font-size: 11px; padding: 4px 0;">EXKLUSIV<br>FÖRHANDSVISNING<br></div>
            <div style="font-size: 37px; line-height: 37px; padding-bottom: 2px; letter-spacing: 3px;">3/9<br></div>
            <div style="font-size: 11px;">17:00-19:00</div>
            <img src="SPLASH-3-2x.png" style="width: 100%;" alt="Exclusive Preview">
        </div>
    </div>

    <script>
        // Adform compliance script
        (function() {
            'use strict';
            
            var banner = document.getElementById('banner');
            var clickTracked = false;
            
            // Get clickTAG value using Adform DHTML library
            var clickTAGvalue = dhtml.getVar('clickTAG', 'https://www.birgerbostad.se');
             
            
            // Click tracking function
            function trackClick() {
                if (clickTracked) return;
                clickTracked = true;
                
                try {
                    // Adform click tracking
                    if (typeof window.adform !== 'undefined' && window.adform.track) {
                        window.adform.track();
                    }
                    
                    // Use clickTAG value for landing page
                    window.open(clickTAGvalue, '_blank');
                } catch (e) {
 
                    // Fallback to clickTAG value
                    window.open(clickTAGvalue, '_blank');
                }
            }
            
            // Exit tracking function
            function trackExit() {
                try {
                    if (typeof window.adform !== 'undefined' && window.adform.trackExit) {
                        window.adform.trackExit();
                    }
                } catch (e) {
                     
                }
            }
            
            // Event listeners
            banner.addEventListener('click', trackClick);
            
            
            // Fallback for non-JavaScript environments
            banner.style.cursor = 'pointer';
            
            // Animation completion tracking
            setTimeout(function() {
                try {
                    if (typeof window.adform !== 'undefined' && window.adform.trackImpression) {
                        window.adform.trackImpression();
                    }
                } catch (e) {
                      
                }
            }, 3500); // After all animations complete (0.5s + 1.2s + 2s + buffer)
            
        })();
    </script>
</body>
</html>
